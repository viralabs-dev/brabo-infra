name: politica

# Política de PR do Brabo, pelos workflows reutilizáveis do brabo-ci (AT-696).
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-police:
    uses: viralabs-dev/brabo-ci/.github/workflows/pr-police.yml@dfd333f49dea28cc73f6268b328ee1208de53b92  # v1.7.0
    with:
      ci_ref: dfd333f49dea28cc73f6268b328ee1208de53b92  # v1.7.0
  escada:
    uses: viralabs-dev/brabo-ci/.github/workflows/approval-ladder.yml@dfd333f49dea28cc73f6268b328ee1208de53b92  # v1.7.0
    with:
      ci_ref: dfd333f49dea28cc73f6268b328ee1208de53b92  # v1.7.0
