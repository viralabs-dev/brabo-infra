name: politica

# Política de PR do Brabo, pelos workflows reutilizáveis do brabo-ci (AT-696).
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-police:
    uses: viralabs-dev/brabo-ci/.github/workflows/pr-police.yml@e212b715d669c0388ce3bb9526278f1820f094c1  # v1.6.0
    with:
      ci_ref: e212b715d669c0388ce3bb9526278f1820f094c1  # v1.6.0
  escada:
    uses: viralabs-dev/brabo-ci/.github/workflows/approval-ladder.yml@e212b715d669c0388ce3bb9526278f1820f094c1  # v1.6.0
    with:
      ci_ref: e212b715d669c0388ce3bb9526278f1820f094c1  # v1.6.0
