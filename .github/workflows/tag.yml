name: tag
on:
  push:
    branches: [dev, main]
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  carimbar:
    uses: viralabs-dev/brabo-ci/.github/workflows/tag-release.yml@dfd333f49dea28cc73f6268b328ee1208de53b92  # v1.7.0
    with:
      ci_ref: dfd333f49dea28cc73f6268b328ee1208de53b92  # v1.7.0
    secrets:
      APP_ID: ${{ secrets.BRABO_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.BRABO_APP_PRIVATE_KEY }}
