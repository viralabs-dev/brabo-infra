name: Provas de propriedade (agendado)

# BRB-009 — as três provas de PROPRIEDADE do deploy em Kubernetes, que até
# aqui só rodavam quando alguém digitava `make`:
#
#   make hpa-test      deploy/k8s/hpa-test.sh      o HPA do engine escala com a fila do Oban
#   make rollout-test  deploy/k8s/rollout-test.sh  rollout restart sem sessão órfã
#   make test-restore  deploy/k8s/test-restore.sh  backup real restaurado e validado
#
# E, desde a AT-127 (BRB-018), um QUARTO alvo:
#
#   make test-reprojecao-k8s  deploy/k8s/test-reprojecao.sh  o grafo apagado é
#                             reconstruído do event log, dentro do cluster
#
# E, desde a AT-198, a irmã dele para a pasta `docs/` dos artefatos (RN-590):
#
#   make test-reprojecao-artefatos-k8s  deploy/k8s/test-reprojecao-artefatos.sh
#
# E, desde a AT-146 (BRB-010), o ENSAIO da rotação da chave mestra, que nunca
# tinha rodado em ambiente real — o ÚLTIMO alvo, porque troca um segredo e
# reinicia a api:
#
#   make test-rotacao-chave-mestra-k8s  deploy/k8s/test-rotacao-chave-mestra.sh
#
# E, desde a AT-126 (BRB-009), a prova DA prova: `make test-restore-mutacao`
# quebra o restore de propósito (a origem ganha uma tabela que o dump não tem) e
# reprova se o restore NÃO reprovar — "um verde não diz que a prova ainda
# enxerga uma falha". Só numa rodada em que restore e mutação passam, o
# workflow guarda `ultima-execucao-boa.json` como artefato (a data que a seção
# "Last verified run" do runbook deixou de manter à mão).
#
# Elas provam propriedade, não configuração: um backup que roda todo dia e não
# restaura passa pelos cinco alertas de `brabo-alerts.yaml` (backup ATRASADO e
# backup FALHO, nunca restore que deixou de funcionar). Sem agenda, a última
# prova do restore era a data escrita à mão em `docs/runbook.md`.
#
# SEPARADO de `ci.yml`, pelo mesmo motivo de `golden-set-rag.yml`: aquele é
# deliberadamente só `pull_request`, e `schedule` misturado ali afetaria todo
# job existente. E NUNCA gate: sobe um cluster inteiro e custa dezenas de
# minutos — sinal de tendência, não trava de merge. Nenhum check required
# espera por este workflow.
#
# É o PRIMEIRO workflow do repositório que sobe cluster. O ambiente é o MESMO
# que um humano obtém com `make deploy-local`: `deploy/k8s/bootstrap.sh` num
# k3d (k3d e não kind porque o kindnet ignora NetworkPolicy em silêncio — ver o
# comentário em `pick_cluster_tool`), as quatro imagens de produção CONSTRUÍDAS
# do checkout e importadas no cluster — menos a stack de observabilidade, que
# as provas não leem (AT-177, `BRABO_SKIP_OBSERVABILITY`). Não GHCR por digest (ADR 0119): o que se
# quer provar é a árvore da branch, não a última release, e construir não exige
# segredo nenhum.
#
# Falha vira ISSUE, uma por alvo, e a segunda falha do mesmo alvo vira
# COMENTÁRIO na issue aberta — senão isto seria "um workflow vermelho por dia
# que ninguém lia" (`.github/dependabot.yml`), e enxurrada de issues idênticas
# ensina a ignorar (`tag-release.yml`). Desde a AT-212 a primeira rodada em que
# o alvo PASSA fecha a issue dele, e só a rodada do ramo PADRÃO toca issue: a de
# um `workflow_dispatch` numa branch reprova no próprio run e para aí.
#
# Desde a AT-195, um SEGUNDO job, `restore-compose`, roda noutro runner
# `make test-restore-compose` contra o compose de produção (a instalação sem
# cluster, ADR 0152). Ele continua um alvo separado no `Makefile`, que não faz
# o caminho do compose depender de `kubectl`; o que mudou é que ele deixou de
# rodar só por memória.
#
# FORA daqui, de propósito: o golden-set do QA (BRB-007), que tem workflow
# próprio e semanal, `golden-set-qa.yml` (ADR 0168).
on:
  schedule:
    # Semanal, domingo 04:00 UTC. A cadência é pelo CUSTO MEDIDO — ver
    # `docs/runbook.md`, seção "Scheduled property proofs".
    - cron: '0 4 * * 0'
  workflow_dispatch:

# O grupo é POR REF (AT-212). Duas rodadas no MESMO ref seguem em fila —
# disputariam as MESMAS issues: a segunda veria a issue que a primeira ainda
# está abrindo. Em refs DIFERENTES não há o que disputar: só a rodada do ramo
# padrão toca issue (`scripts/ci/alarmar-prova.sh`), e cada uma sobe o próprio
# cluster no próprio runner. Com o grupo global, um `workflow_dispatch` numa
# branch ficava pendente atrás do de outra e um TERCEIRO cancelava o pendente
# (o Actions guarda um só na fila por grupo) — medido nas rodadas 1 e 2 do
# Plano de entrega. No mesmo ref isso continua valendo, e é o desejado.
concurrency:
  group: propriedades-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Versões IGUAIS às que `deploy/k8s/bootstrap.sh` instalaria. O bootstrap
  # baixa o k3d sem conferir checksum — instalando aqui antes, com hash pinado,
  # o `ensure_k3d` dele encontra o binário e não baixa nada. O passo
  # "Versões batem com o bootstrap" reprova se as duas divergirem.
  K3D_VERSION: 'v5.8.3'
  K3D_SHA256: 'dbaa79a76ace7f4ca230a1ff41dc7d8a5036a8ad0309e9c54f9bf3836dbe853e'
  HELM_VERSION: 'v3.19.0'
  HELM_SHA256: 'a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496'
  # O k3s que o k3d v5.8.3 sobe por padrão é da linha 1.31; kubectl no mesmo
  # menor evita depender do que a imagem do runner trouxer no dia.
  KUBECTL_VERSION: 'v1.31.5'
  KUBECTL_SHA256: 'fbecbfd375b3686002c2e81d51c390172f5ffba3d6b47920d55342cb03f557af'

jobs:
  provas:
    name: Provas de propriedade (k3d)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Versões batem com o bootstrap
        run: |
          set -euo pipefail
          for par in "K3D_VERSION:${K3D_VERSION}" "HELM_VERSION:${HELM_VERSION}"; do
            nome="${par%%:*}"; valor="${par#*:}"
            grep -qx "${nome}=\"${valor}\"" deploy/k8s/bootstrap.sh \
              || { echo "::error::${nome}=${valor} aqui, outro valor em deploy/k8s/bootstrap.sh"; exit 1; }
          done

      - name: Instalar k3d, helm e kubectl (checksum pinado)
        run: |
          set -euxo pipefail
          curl -fsSL -o /tmp/k3d \
            "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          echo "${K3D_SHA256}  /tmp/k3d" | sha256sum -c -
          sudo install -m 0755 /tmp/k3d /usr/local/bin/k3d

          curl -fsSL -o /tmp/helm.tar.gz \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  /tmp/helm.tar.gz" | sha256sum -c -
          tar -xzf /tmp/helm.tar.gz -C /tmp
          sudo install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm

          curl -fsSL -o /tmp/kubectl \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  /tmp/kubectl" | sha256sum -c -
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl

          k3d version
          helm version --short
          kubectl version --client
          # O que o runner oferece, medido e não presumido: nas rodadas de
          # medição foram 4 vCPUs, 15 GiB de RAM e 87 GB livres em disco — por
          # isso NÃO há passo de "liberar disco" (as quatro imagens e a cópia
          # delas no k3d cabem com folga).
          nproc; free -h; df -h /

      # Cada passo abaixo cronometra a si mesmo e escreve uma linha no resumo:
      # a duração é o que decide a cadência, e ela sai MEDIDA de cada rodada.
      - name: Tabela de durações
        run: |
          {
            echo '| passo | duração | saída |'
            echo '|---|---|---|'
          } >> "$GITHUB_STEP_SUMMARY"

      # `bootstrap.sh`, não `make deploy-local`: o alvo encadeia o smoke e o
      # `&&` do make esconderia qual das duas metades falhou.
      #
      # AT-177: `BRABO_SKIP_OBSERVABILITY=1` tira Tempo, Loki, Collector, Alloy
      # e Grafana — ~133 s medidos que nenhuma das provas abaixo lê. O
      # Prometheus e o prometheus-adapter FICAM: o `smoke-k8s` e o `hpa-test`
      # leem `oban_queue_depth` pela External Metrics API que eles servem. É a
      # única diferença entre este cluster e o de `make deploy-local`.
      - name: Subir o cluster (bootstrap)
        id: bootstrap
        env:
          BRABO_SKIP_OBSERVABILITY: '1'
        run: |
          set -uo pipefail
          inicio=$SECONDS
          bash deploy/k8s/bootstrap.sh; saida=$?
          echo "| bootstrap | $((SECONDS - inicio))s | ${saida} |" >> "$GITHUB_STEP_SUMMARY"
          df -h /; free -h
          exit "${saida}"

      - name: make smoke-k8s
        id: smoke
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: |
          set -uo pipefail
          inicio=$SECONDS
          make smoke-k8s; saida=$?
          echo "| smoke-k8s | $((SECONDS - inicio))s | ${saida} |" >> "$GITHUB_STEP_SUMMARY"
          exit "${saida}"

      # Os três rodam mesmo quando um anterior falha — `!cancelled()` em vez do
      # `success()` implícito. Um HPA quebrado não pode esconder um restore
      # quebrado. A ORDEM é a do Makefile, e ela importa: o `hpa-test` deixa o
      # engine com mais réplicas, e o `rollout-test` roda contra esse estado.
      - name: make hpa-test
        id: hpa
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: |
          set -uo pipefail
          inicio=$SECONDS
          make hpa-test; saida=$?
          echo "| hpa-test | $((SECONDS - inicio))s | ${saida} |" >> "$GITHUB_STEP_SUMMARY"
          exit "${saida}"

      # AT-078: a prova grava o log de TODO pod do engine (os antigos, que o
      # rollout mata, inclusive), os eventos do namespace e as réplicas do
      # HPA neste diretório, e o passo seguinte o sobe como artefato.
      - name: make rollout-test
        id: rollout
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        env:
          ROLLOUT_EVIDENCE_DIR: ${{ runner.temp }}/rollout-evidencia
        run: |
          set -uo pipefail
          inicio=$SECONDS
          make rollout-test; saida=$?
          echo "| rollout-test | $((SECONDS - inicio))s | ${saida} |" >> "$GITHUB_STEP_SUMMARY"
          exit "${saida}"

      # Sobe SEMPRE que a prova rodou, verde inclusive: é numa rodada verde que
      # se confere que a evidência existe antes de precisar dela. Numa órfã, é o
      # único lugar onde sobrevive o log do pod antigo que a hospedava.
      - name: Evidência do rollout-test
        if: ${{ !cancelled() && steps.rollout.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: rollout-evidencia
          path: ${{ runner.temp }}/rollout-evidencia/
          include-hidden-files: false
          retention-days: 14
          if-no-files-found: warn

      # Teto do PASSO, além do do script. `test-restore.sh` esperava o Job com
      # `wait --for=condition=complete`, que nunca vê um Job `Failed`, e o
      # primeiro restore quebrado custou os 20 min inteiros deste teto para
      # dizer o que o log do Job dizia em segundos. O script agora vê as duas
      # condições (`esperar_job`); este teto fica como rede para o que ele não
      # cobre — um Job que nunca agenda —, e o restore medido leva segundos.
      - name: make test-restore
        id: restore
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        timeout-minutes: 20
        # A opção de depuração que o próprio script documenta: sem ela, o
        # `trap` apaga os dois Jobs na saída e o log do restore que falhou some
        # antes do passo de diagnóstico. O cluster morre com o runner.
        env:
          RESTORE_KEEP_JOB: '1'
        run: |
          set -uo pipefail
          inicio=$SECONDS
          make test-restore; saida=$?
          echo "| test-restore | $((SECONDS - inicio))s | ${saida} |" >> "$GITHUB_STEP_SUMMARY"
          echo "segundos=$((SECONDS - inicio))" >> "$GITHUB_OUTPUT"
          exit "${saida}"

      # AT-126 / BRB-009: a mutação. O restore acima diz que o backup restaura;
      # este passo diz que a prova ainda REPROVA quando não restaura. Quebra o
      # restore de propósito (tabela na origem que o dump não tem) e passa só se
      # o restore reprovar nomeando essa tabela. Se a quebra passar, o passo
      # falha e o passo de issues abaixo abre `make test-restore-mutacao` —
      # sem ninguém olhar. Roda mesmo com o restore vermelho: uma prova cega e
      # uma prova quebrada são dois defeitos, e os dois têm de aparecer.
      - name: make test-restore-mutacao
        id: mutacao
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        timeout-minutes: 20
        env:
          RESTORE_KEEP_JOB: '1'
        run: |
          set -uo pipefail
          inicio=$SECONDS
          make test-restore-mutacao; saida=$?
          echo "| test-restore-mutacao | $((SECONDS - inicio))s | ${saida} |" >> "$GITHUB_STEP_SUMMARY"
          exit "${saida}"

      # A última execução boa do restore, como FATO datado pelo workflow: só
      # existe se o restore passou E a quebra proposital foi pega na mesma
      # rodada. A data que `docs/runbook.md` ("Last verified run") guardava à
      # mão sai daqui — o run mais recente com este artefato é a resposta.
      - name: Registrar a última execução boa do restore
        id: ultima_boa
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && steps.mutacao.outcome == 'success' }}
        env:
          RESTORE_SEGUNDOS: ${{ steps.restore.outputs.segundos }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/restore-verificado"
          mkdir -p "${dir}"
          cat > "${dir}/ultima-execucao-boa.json" <<JSON
          {
            "verificadoEm": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "run": "${GITHUB_RUN_ID}",
            "commit": "${GITHUB_SHA}",
            "ref": "${GITHUB_REF_NAME}",
            "evento": "${GITHUB_EVENT_NAME}",
            "restoreSegundos": ${RESTORE_SEGUNDOS:-null},
            "mutacaoPega": true
          }
          JSON
          cat "${dir}/ultima-execucao-boa.json"
          echo "Última execução boa do restore: $(date -u +%Y-%m-%dT%H:%MZ) (restore aprovado e quebra proposital pega)" >> "$GITHUB_STEP_SUMMARY"

      - name: Artefato da última execução boa do restore
        if: ${{ !cancelled() && steps.ultima_boa.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: restore-ultima-execucao-boa
          path: ${{ runner.temp }}/restore-verificado/
          include-hidden-files: false
          retention-days: 90
          if-no-files-found: error

      # AT-127 / BRB-018: o quarto alvo. Fica DEPOIS do restore só por ordem de
      # escrita — não depende dele nem de nenhum outro alvo: cria o próprio
      # projeto, escopa medida e remoção a ele e só fala com `api` e `neo4j`
      # (a lição do AT-078: um alvo altera o cluster para o seguinte).
      - name: make test-reprojecao-k8s
        id: reprojecao
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          set -uo pipefail
          inicio=$SECONDS
          make test-reprojecao-k8s; saida=$?
          echo "| test-reprojecao-k8s | $((SECONDS - inicio))s | ${saida} |" >> "$GITHUB_STEP_SUMMARY"
          exit "${saida}"

      # AT-198: a irmã do grafo, para a pasta `docs/` dos artefatos (RN-590).
      # Mesmo desenho: projeto próprio, só fala com a `api`, não depende de
      # outro alvo. O arquivo reconstruído tem de ter o MESMO sha256 do que o
      # projetor vivo escreveu.
      - name: make test-reprojecao-artefatos-k8s
        id: reprojecao_artefatos
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          set -uo pipefail
          inicio=$SECONDS
          make test-reprojecao-artefatos-k8s; saida=$?
          echo "| test-reprojecao-artefatos-k8s | $((SECONDS - inicio))s | ${saida} |" >> "$GITHUB_STEP_SUMMARY"
          exit "${saida}"

      # AT-146 (BRB-010): os três passos da rotação de `CREDENTIALS_MASTER_KEY`
      # do runbook, pela fonte do `ExternalSecret`, com restart da api e o
      # `rewrap-deks.js` da imagem. POR ÚLTIMO de propósito: troca a chave
      # mestra do cluster e reinicia a api, e nenhum alvo deveria herdar isso.
      # Não depende do verde dos outros, só do bootstrap.
      - name: make test-rotacao-chave-mestra-k8s
        id: rotacao_chave_mestra
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          set -uo pipefail
          inicio=$SECONDS
          make test-rotacao-chave-mestra-k8s; saida=$?
          echo "| test-rotacao-chave-mestra-k8s | $((SECONDS - inicio))s | ${saida} |" >> "$GITHUB_STEP_SUMMARY"
          exit "${saida}"

      - name: Estado do cluster (só em falha)
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n brabo get events --sort-by=.lastTimestamp | tail -40 || true
          # O log de quem NÃO está de pé é a mensagem que o evento não tem
          # (CrashLoopBackOff diz que caiu, nunca por quê). `--previous` pega a
          # execução que morreu; sem ela, a atual.
          for ns in brabo brabo-db; do
            kubectl -n "${ns}" get pods --no-headers 2>/dev/null \
              | awk '$3 != "Completed" && ($3 != "Running" || $2 ~ /^0\//) { print $1 }' \
              | while read -r pod; do
                  echo "=== ${ns}/${pod} ==="
                  kubectl -n "${ns}" logs "${pod}" --all-containers --previous --tail=60 2>/dev/null \
                    || kubectl -n "${ns}" logs "${pod}" --all-containers --tail=60 2>&1 || true
                done
          done
          kubectl describe nodes | sed -n '/Allocated resources/,/Events/p' || true
          df -h / || true
          free -h || true

      # Uma issue POR ALVO, reaproveitada. A busca é `--json` + comparação
      # EXATA de título (o mesmo desenho de `tag-release.yml`): o título tem
      # crase, e a sintaxe de busca do GitHub a trataria como operador.
      #
      # O bootstrap também tem título próprio: com o cluster fora, os três alvos
      # ficam `skipped`, e skipped num run agendado é o silêncio que isto existe
      # para quebrar.
      #
      # Roda também no VERDE (AT-212): é o verde que fecha a issue do alvo que
      # voltou a passar. Numa branch, `alarmar` não toca issue nenhuma.
      - name: Abrir, atualizar ou fechar a issue de cada alvo
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          URL_DO_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BOOTSTRAP: ${{ steps.bootstrap.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          HPA: ${{ steps.hpa.outcome }}
          ROLLOUT: ${{ steps.rollout.outcome }}
          RESTORE: ${{ steps.restore.outcome }}
          MUTACAO: ${{ steps.mutacao.outcome }}
          REPROJECAO: ${{ steps.reprojecao.outcome }}
          REPROJECAO_ARTEFATOS: ${{ steps.reprojecao_artefatos.outcome }}
          ROTACAO_CHAVE_MESTRA: ${{ steps.rotacao_chave_mestra.outcome }}
        run: |
          set -euo pipefail
          source scripts/ci/alarmar-prova.sh
          cluster='o passo "Estado do cluster" tem pods, eventos e recursos do nó'
          alarmar 'bootstrap (o cluster não subiu)' "${BOOTSTRAP}" "${cluster}"
          alarmar 'make smoke-k8s' "${SMOKE}" "${cluster}"
          alarmar 'make hpa-test' "${HPA}" "${cluster}"
          alarmar 'make rollout-test' "${ROLLOUT}" "${cluster}"
          alarmar 'make test-restore' "${RESTORE}" "${cluster}"
          alarmar 'make test-restore-mutacao' "${MUTACAO}" "${cluster}"
          alarmar 'make test-reprojecao-k8s' "${REPROJECAO}" "${cluster}"
          alarmar 'make test-reprojecao-artefatos-k8s' "${REPROJECAO_ARTEFATOS}" "${cluster}"
          alarmar 'make test-rotacao-chave-mestra-k8s' "${ROTACAO_CHAVE_MESTRA}" "${cluster}"

  # AT-195: a MESMA prova do `make test-restore`, contra a instalação por
  # COMPOSE (ADR 0152) — `make test-restore-compose` dispara um backup real,
  # restaura numa database nova com as três validações e VERIFICA o arquivo dos
  # bare repos (`brabo-restore-git`, sem escrever nada). Até aqui só rodava por
  # memória, e é ela que a migração do `install.sh` exige antes de apagar
  # qualquer coisa (RN-530).
  #
  # JOB PRÓPRIO, noutro runner, e não um passo do `provas`: o compose de
  # produção publica 3000/4000/8088, as MESMAS portas que o k3d mapeia, então os
  # dois não coexistem num runner. Em série no mesmo job custariam o tempo das
  # duas metades; em paralelo, o relógio do workflow segue sendo o do cluster.
  # O que se paga a mais é um segundo build das imagens — este pelo MESMO
  # `docker-bake.hcl` do `ci.yml`, como o `smoke.sh` de lá espera (o `provas`
  # constrói pelo bootstrap; o cache do bake ali foi medido e recusado, AT-178).
  restore-compose:
    name: Restore da instalação por compose
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Tabela de durações
        run: |
          {
            echo '| passo | duração | saída |'
            echo '|---|---|---|'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "INICIO_DO_BUILD=$(date +%s)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build das quatro imagens (bake, cache do Actions)
        id: build
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f  # v7.4.0
        with:
          files: docker-bake.hcl
          targets: api,engine,web,backup
          load: true

      - name: Duração do build das imagens
        if: ${{ !cancelled() }}
        env:
          DESFECHO: ${{ steps.build.outcome }}
        run: echo "| build das imagens (bake) | $(( $(date +%s) - INICIO_DO_BUILD ))s | ${DESFECHO} |" >> "$GITHUB_STEP_SUMMARY"

      # O `smoke.sh` do `ci.yml`, com o stack mantido de pé: é ele que deixa o
      # banco com dados (o usuário do seed, a sessão que ele ativa) para o
      # backup ter o que levar.
      - name: Subir o compose de produção (smoke)
        id: compose
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -uo pipefail
          inicio=$SECONDS
          SMOKE_NO_BUILD=1 SMOKE_KEEP_UP=1 bash docker/smoke.sh; saida=$?
          echo "| compose de pé (smoke) | $((SECONDS - inicio))s | ${saida} |" >> "$GITHUB_STEP_SUMMARY"
          exit "${saida}"

      # Sem um bare repo no volume, `brabo-restore-git` responde "nada a
      # restaurar" e sai com 0 — a metade do git passaria sem ter lido arquivo
      # nenhum. O repo nasce do MESMO jeito que o `LocalGitProvider` o cria
      # (`git init --bare` em `/data/git-repos`, pelo usuário da api), só que
      # sem passar por um projeto: é FIXTURE da prova, e o que ela prova é que
      # o arquivo do backup é íntegro e contém o repo, não que um projeto o
      # provisionou. `test-restore-compose.sh` não o cria por conta própria de
      # propósito — ele também roda na migração de uma instalação real.
      - name: Um bare repo no volume (fixture da prova)
        id: fixture
        if: ${{ !cancelled() && steps.compose.outcome == 'success' }}
        run: |
          set -euo pipefail
          docker compose -f docker/docker-compose.prod.yml exec -T api \
            git init --bare --quiet /data/git-repos/prova-restore.git
          docker compose -f docker/docker-compose.prod.yml exec -T api \
            ls /data/git-repos/prova-restore.git/objects

      - name: make test-restore-compose
        id: restore_compose
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          set -uo pipefail
          inicio=$SECONDS
          saida_log="$(mktemp)"
          make test-restore-compose 2>&1 | tee "${saida_log}"; saida=${PIPESTATUS[0]}
          echo "| test-restore-compose | $((SECONDS - inicio))s | ${saida} |" >> "$GITHUB_STEP_SUMMARY"
          # Verde sem ter lido o repo seria o falso verde que a fixture existe
          # para impedir: o veredito do git tem de NOMEAR o bare repo.
          if [ "${saida}" = 0 ] && ! grep -q 'bare repo(s) íntegros' "${saida_log}"; then
            echo "::error::test-restore-compose passou sem verificar bare repo nenhum"
            exit 1
          fi
          exit "${saida}"

      - name: Estado do compose (só em falha)
        if: failure()
        run: |
          docker compose -f docker/docker-compose.prod.yml ps -a || true
          docker compose -f docker/docker-compose.prod.yml logs --tail=60 || true
          df -h / || true

      - name: Abrir, atualizar ou fechar a issue de cada alvo
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          URL_DO_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD: ${{ steps.build.outcome }}
          COMPOSE: ${{ steps.compose.outcome }}
          FIXTURE: ${{ steps.fixture.outcome }}
          RESTORE_COMPOSE: ${{ steps.restore_compose.outcome }}
        run: |
          set -euo pipefail
          source scripts/ci/alarmar-prova.sh
          compose='o passo "Estado do compose" tem os serviços e os logs'
          alarmar 'build das imagens (bake, restore-compose)' "${BUILD}"
          alarmar 'compose de produção (o stack não subiu)' "${COMPOSE}" "${compose}"
          alarmar 'fixture do bare repo' "${FIXTURE}" "${compose}"
          alarmar 'make test-restore-compose' "${RESTORE_COMPOSE}" "${compose}"
