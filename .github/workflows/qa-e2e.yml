name: qa-e2e

# Liga o brabo-qa nas PRs para a dev (regressivo por funcionalidade, AT-769: check
# `Regressivo do brabo-qa`, só atesta, nunca obrigatório) e para a main (portão da main,
# AT-765: check `E2E do brabo-qa`, obrigatório).
on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  qa-e2e:
    uses: viralabs-dev/brabo-ci/.github/workflows/qa-e2e-gatilho.yml@dfd333f49dea28cc73f6268b328ee1208de53b92  # v1.7.0
    with:
      ci_ref: dfd333f49dea28cc73f6268b328ee1208de53b92  # v1.7.0
    secrets:
      APP_ID: ${{ secrets.BRABO_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.BRABO_APP_PRIVATE_KEY }}
